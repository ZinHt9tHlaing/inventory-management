info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@gmail.com",
        "password": "password"
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
