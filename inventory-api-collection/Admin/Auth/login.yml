info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@gmail.com",
        "password": "password"
      }
  auth:
    type: bearer
    token: ""

scripts:
  post-response: |-
    if (res.getStatus() === 200) {
      const body = res.getBody();
      if (body && body.token) {
        bru.setVar("adminToken", body.token);
      }
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
