info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/user/register"
  body:
    type: json
    data: |-
      {
        "name": "User",
        "email": "user@gmail.com",
        "password": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
